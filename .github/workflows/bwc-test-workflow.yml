name: Backward compatibility test workflow
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "*"

jobs:
  test:
    # This job runs on Linux
    runs-on: ubuntu-latest
    steps:
      # This step uses the setup-java Github action: https://github.com/actions/setup-java
      - name: Set Up JDK
        uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc # v2
        with:
          distribution: temurin # Temurin is a distribution of adoptium
          java-version: 21
      # index-management
      - name: Checkout Branch
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - name: Run IM Backwards Compatibility Tests
        run: |
          echo "Running backwards compatibility tests..."
          ./gradlew bwcTestSuite
      - name: Upload failed logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: logs
          overwrite: 'true'
          path: build/testclusters/indexmanagementBwcCluster*/logs/*
