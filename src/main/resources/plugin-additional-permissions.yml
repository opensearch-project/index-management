# Field-domain searches use this identity only after policy-user computation authorization.
# Publication itself remains policy-user authorized.
# The grant covers all indices; FieldDomainSearchContext targets the exact managed index.
cluster_permissions: []
index_permissions:
  - index_patterns:
      - "*"
    allowed_actions:
      - "indices:data/read/search*"
